<style>:root{
--paper:#E9EAE1;
--raised:#F4F5ED;
--ink:#1B1E16;
--ink-soft:#5C6153;
--rule:#CDD0C2;
--pom:#96271F;
--pom-ink:#FBF3F1;
--pom-wash:#F0DCD7;
--moss:#45592F;
--moss-wash:#DDE4CE;
--shadow:rgba(27,30,22,.13);
--tap:104px;
--tap-gap:40px;
--zoom:1;
}
*{box-sizing:border-box}
html{overscroll-behavior:none}
body{
margin:0;
direction:rtl;
background:var(--paper);
color:var(--ink);
font-family:"Assistant","Segoe UI",system-ui,sans-serif;
font-size:22px;
line-height:1.55;
-webkit-text-size-adjust:100%;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
overscroll-behavior:none;
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:4px solid var(--pom);outline-offset:4px}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
.wrap{
zoom:var(--zoom);
max-width:760px;
margin:0 auto;
padding:32px 24px 64px;
min-height:100vh;
display:flex;
flex-direction:column;
}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}
.masthead{
display:flex;
align-items:baseline;
justify-content:space-between;
gap:16px;
padding-bottom:18px;
border-bottom:2px solid var(--rule);
margin-bottom:40px;
}
.wordmark{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:34px;
font-weight:700;
letter-spacing:.02em;
margin:0;
}
.today{
font-size:19px;
color:var(--ink-soft);
font-variant-numeric:tabular-nums;
}
.greeting{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:clamp(32px,6vw,44px);
font-weight:500;
line-height:1.25;
text-wrap:balance;
margin:0 0 8px;
}
.greeting-sub{
font-size:21px;
color:var(--ink-soft);
margin:0 0 40px;
}
.cards{display:flex;flex-direction:column;gap:var(--tap-gap)}
.card{
display:flex;
align-items:center;
gap:24px;
width:100%;
min-height:var(--tap);
padding:26px 28px;
text-align:right;
background:var(--raised);
border:2px solid var(--rule);
border-radius:4px;
box-shadow:0 2px 0 var(--shadow);
transition:transform .12s ease,border-color .12s ease;
}
.card:active{transform:translateY(2px);box-shadow:none}
.card.done{border-color:var(--moss);background:var(--moss-wash)}
.card-num{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:40px;
font-weight:700;
color:var(--pom);
min-width:44px;
text-align:center;
font-variant-numeric:tabular-nums;
}
.card.done .card-num{color:var(--moss)}
.card-body{flex:1}
.card-title{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:32px;
font-weight:700;
line-height:1.2;
display:block;
}
.card-note{font-size:19px;color:var(--ink-soft);display:block;margin-top:4px}
.card-mark{font-size:32px;color:var(--moss);font-weight:700}
.back{
display:inline-flex;
align-items:center;
gap:10px;
min-height:64px;
padding:0 20px 0 24px;
margin-bottom:28px;
align-self:flex-start;
font-size:21px;
font-weight:600;
color:var(--ink-soft);
border:2px solid var(--rule);
border-radius:4px;
background:var(--raised);
}
.stage-line{
font-size:18px;
letter-spacing:.09em;
text-transform:uppercase;
color:var(--ink-soft);
margin:0 0 20px;
font-weight:600;
}
.prompt{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:clamp(30px,5.4vw,40px);
font-weight:500;
line-height:1.3;
text-wrap:balance;
margin:0 0 32px;
}
.btn{
display:flex;
align-items:center;
justify-content:center;
gap:14px;
width:100%;
min-height:var(--tap);
padding:20px 28px;
font-size:29px;
font-weight:600;
border-radius:4px;
border:2px solid transparent;
transition:transform .12s ease;
}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--pom);color:var(--pom-ink);box-shadow:0 3px 0 #6D1C16}
.btn-primary:active{box-shadow:0 1px 0 #6D1C16}
.btn-quiet{background:var(--raised);border-color:var(--rule);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:var(--tap-gap);margin-top:8px}
.portrait-frame{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
margin-bottom:32px;
}
.portrait{
width:min(300px,62vw);
aspect-ratio:1;
border-radius:4px;
border:3px solid var(--rule);
background:var(--raised);
overflow:hidden;
box-shadow:0 3px 0 var(--shadow);
}
.portrait svg,.portrait img{width:100%;height:100%;display:block;object-fit:cover}
.person-name{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:clamp(38px,7vw,52px);
font-weight:700;
line-height:1.1;
margin:0;
text-align:center;
}
.person-rel{font-size:23px;color:var(--ink-soft);text-align:center;margin:0}
.person-fact{
font-size:23px;
text-align:center;
margin:0;
max-width:34ch;
color:var(--ink);
}
.feedback{
min-height:80px;
display:flex;
align-items:center;
justify-content:center;
gap:14px;
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:30px;
font-weight:500;
text-align:center;
margin-bottom:8px;
padding:0 12px;
}
.feedback.good{color:var(--moss)}
.feedback.gentle{color:var(--ink-soft)}
.choice{
display:flex;
align-items:center;
justify-content:center;
width:100%;
min-height:var(--tap);
padding:18px 28px;
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:34px;
font-weight:500;
background:var(--raised);
border:2px solid var(--rule);
border-radius:4px;
box-shadow:0 2px 0 var(--shadow);
transition:transform .12s ease;
}
.choice:active{transform:translateY(2px);box-shadow:none}
.choice.is-right{background:var(--moss-wash);border-color:var(--moss)}
.choice.is-shown{background:var(--pom-wash);border-color:var(--pom)}
.choice[disabled]{opacity:.5}
.hint-name{
display:block;
text-align:center;
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:30px;
