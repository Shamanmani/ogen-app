<style>:root{
--paper:#E9EAE1;
--raised:#F4F5ED;
--ink:#1B1E16;
--ink-soft:#5C6153;
--rule:#CDD0C2;
--pom:#96271F;
--pom-ink:#FBF3F1;
--pom-wash:#F0DCD7;
--moss:#45592F;
--moss-wash:#DDE4CE;
--shadow:rgba(27,30,22,.13);
--tap:104px;
--tap-gap:40px;
--zoom:1;
}
*{box-sizing:border-box}
html{overscroll-behavior:none}
body{
margin:0;
direction:rtl;
background:var(--paper);
color:var(--ink);
font-family:"Assistant","Segoe UI",system-ui,sans-serif;
font-size:22px;
line-height:1.55;
-webkit-text-size-adjust:100%;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
overscroll-behavior:none;
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:4px solid var(--pom);outline-offset:4px}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
.wrap{
zoom:var(--zoom);
max-width:760px;
margin:0 auto;
padding:32px 24px 64px;
min-height:100vh;
display:flex;
flex-direction:column;
}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}
.masthead{
display:flex;
align-items:baseline;
justify-content:space-between;
gap:16px;
padding-bottom:18px;
border-bottom:2px solid var(--rule);
margin-bottom:40px;
}
.wordmark{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:34px;
font-weight:700;
letter-spacing:.02em;
margin:0;
}
.today{
font-size:19px;
color:var(--ink-soft);
font-variant-numeric:tabular-nums;
}
.greeting{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:clamp(32px,6vw,44px);
font-weight:500;
line-height:1.25;
text-wrap:balance;
margin:0 0 8px;
}
.greeting-sub{
font-size:21px;
color:var(--ink-soft);
margin:0 0 40px;
}
.cards{display:flex;flex-direction:column;gap:var(--tap-gap)}
.card{
display:flex;
align-items:center;
gap:24px;
width:100%;
min-height:var(--tap);
padding:26px 28px;
text-align:right;
background:var(--raised);
border:2px solid var(--rule);
border-radius:4px;
box-shadow:0 2px 0 var(--shadow);
transition:transform .12s ease,border-color .12s ease;
}
.card:active{transform:translateY(2px);box-shadow:none}
.card.done{border-color:var(--moss);background:var(--moss-wash)}
.card-num{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:40px;
font-weight:700;
color:var(--pom);
min-width:44px;
text-align:center;
font-variant-numeric:tabular-nums;
}
.card.done .card-num{color:var(--moss)}
.card-body{flex:1}
.card-title{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:32px;
font-weight:700;
line-height:1.2;
display:block;
}
.card-note{font-size:19px;color:var(--ink-soft);display:block;margin-top:4px}
.card-mark{font-size:32px;color:var(--moss);font-weight:700}
.back{
display:inline-flex;
align-items:center;
gap:10px;
min-height:64px;
padding:0 20px 0 24px;
margin-bottom:28px;
align-self:flex-start;
font-size:21px;
font-weight:600;
color:var(--ink-soft);
border:2px solid var(--rule);
border-radius:4px;
background:var(--raised);
}
.stage-line{
font-size:18px;
letter-spacing:.09em;
text-transform:uppercase;
color:var(--ink-soft);
margin:0 0 20px;
font-weight:600;
}
.prompt{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:clamp(30px,5.4vw,40px);
font-weight:500;
line-height:1.3;
text-wrap:balance;
margin:0 0 32px;
}
.btn{
display:flex;
align-items:center;
justify-content:center;
gap:14px;
width:100%;
min-height:var(--tap);
padding:20px 28px;
font-size:29px;
font-weight:600;
border-radius:4px;
border:2px solid transparent;
transition:transform .12s ease;
}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--pom);color:var(--pom-ink);box-shadow:0 3px 0 #6D1C16}
.btn-primary:active{box-shadow:0 1px 0 #6D1C16}
.btn-quiet{background:var(--raised);border-color:var(--rule);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:var(--tap-gap);margin-top:8px}
.portrait-frame{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
margin-bottom:32px;
}
.portrait{
width:min(300px,62vw);
aspect-ratio:1;
border-radius:4px;
border:3px solid var(--rule);
background:var(--raised);
overflow:hidden;
box-shadow:0 3px 0 var(--shadow);
}
.portrait svg,.portrait img{width:100%;height:100%;display:block;object-fit:cover}
.person-name{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:clamp(38px,7vw,52px);
font-weight:700;
line-height:1.1;
margin:0;
text-align:center;
}
.person-rel{font-size:23px;color:var(--ink-soft);text-align:center;margin:0}
.person-fact{
font-size:23px;
text-align:center;
margin:0;
max-width:34ch;
color:var(--ink);
}
.feedback{
min-height:80px;
display:flex;
align-items:center;
justify-content:center;
gap:14px;
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:30px;
font-weight:500;
text-align:center;
margin-bottom:8px;
padding:0 12px;
}
.feedback.good{color:var(--moss)}
.feedback.gentle{color:var(--ink-soft)}
.choice{
display:flex;
align-items:center;
justify-content:center;
width:100%;
min-height:var(--tap);
padding:18px 28px;
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:34px;
font-weight:500;
background:var(--raised);
border:2px solid var(--rule);
border-radius:4px;
box-shadow:0 2px 0 var(--shadow);
transition:transform .12s ease;
}
.choice:active{transform:translateY(2px);box-shadow:none}
.choice.is-right{background:var(--moss-wash);border-color:var(--moss)}
.choice.is-shown{background:var(--pom-wash);border-color:var(--pom)}
.choice[disabled]{opacity:.5}
.hint-name{
display:block;
text-align:center;
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:30px;

background:var(--pom-wash);
border-radius:4px;
padding:12px 20px;
margin:0 auto 28px;
max-width:fit-content;
}
.from-line{
display:inline-block;
font-size:19px;
font-weight:600;
letter-spacing:.06em;
color:var(--pom);
background:var(--pom-wash);
padding:8px 18px;
border-radius:3px;
margin-bottom:22px;
}
.rec-btn{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:12px;
width:100%;
min-height:180px;
border-radius:4px;
background:var(--pom);
color:var(--pom-ink);
font-size:34px;
font-weight:700;
box-shadow:0 3px 0 #6D1C16;
}
.rec-btn.recording{background:var(--moss);box-shadow:0 3px 0 #2E3D1F}
.rec-dot{width:26px;height:26px;border-radius:50%;background:currentColor}
.rec-btn.recording .rec-dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rec-time{font-size:22px;font-variant-numeric:tabular-nums;opacity:.9}
.event{
display:flex;
flex-direction:column;
align-items:flex-start;
gap:6px;
width:100%;
min-height:var(--tap);
padding:24px 28px;
text-align:right;
background:var(--raised);
border:2px solid var(--rule);
border-radius:4px;
box-shadow:0 2px 0 var(--shadow);
transition:transform .12s ease;
}
.event:active{transform:translateY(2px);box-shadow:none}
.event.is-right{background:var(--moss-wash);border-color:var(--moss)}
.event-title{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:30px;font-weight:500;line-height:1.25}
.event-year{font-size:20px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.orient{
padding:24px 28px;
margin:0 0 36px;
background:var(--raised);
border:2px solid var(--rule);
border-inline-start:6px solid var(--moss);
border-radius:4px;
}
.orient-day{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:clamp(34px,6vw,46px);
font-weight:700;line-height:1.1;margin:0;
}
.orient-date{font-size:23px;color:var(--ink-soft);margin:4px 0 0;font-variant-numeric:tabular-nums}
.orient-note{font-size:24px;margin:14px 0 0;color:var(--ink)}
.orient-note:empty{display:none}
.cues{
display:flex;flex-direction:column;gap:12px;
margin:0 0 28px;padding:0;
font-size:24px;color:var(--ink-soft);
}
.cues:empty{display:none}
.cues span{
background:var(--pom-wash);color:var(--pom);
padding:14px 22px;border-radius:4px;
font-weight:600;
}
.answer{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:clamp(44px,9vw,64px);
font-weight:700;text-align:center;line-height:1.1;
margin:0 0 28px;padding:22px;
background:var(--moss-wash);color:var(--moss);
border-radius:4px;
}
.seq{list-style:none;margin:0 0 28px;padding:0;display:flex;flex-direction:column;gap:10px}
.seq:empty{display:none}
.seq li{
display:flex;align-items:center;gap:18px;
padding:16px 22px;
background:var(--pom-wash);
border:2px solid var(--pom);
border-radius:4px;
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:26px;
}
.seq li .n{
font-weight:700;color:var(--pom);min-width:28px;
font-variant-numeric:tabular-nums;
}
.seq li.ok{background:var(--moss-wash);border-color:var(--moss)}
.seq li.ok .n{color:var(--moss)}
.seq li.off{background:var(--raised);border-color:var(--rule)}
.seq li.off .n{color:var(--ink-soft)}
.seq li .yr{margin-inline-start:auto;font-family:"Assistant",sans-serif;font-size:19px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.family-link{
margin-top:auto;
padding-top:48px;
text-align:center;
font-size:15px;
color:var(--ink-soft);
opacity:.65;
}
.family-link button{font-size:15px;text-decoration:underline;padding:8px}
.panel-h{
font-family:"Frank Ruhl Libre",Georgia,serif;
font-size:26px;
font-weight:700;
margin:36px 0 14px;
padding-bottom:8px;
border-bottom:2px solid var(--rule);
}
.panel-note{font-size:17px;color:var(--ink-soft);margin:0 0 18px;line-height:1.6}
.row{
display:flex;
align-items:center;
gap:16px;
padding:14px 0;
border-bottom:1px solid var(--rule);
}
.row .thumb{width:62px;height:62px;border-radius:3px;overflow:hidden;border:1px solid var(--rule);flex:none;background:var(--raised)}
.row .thumb svg,.row .thumb img{width:100%;height:100%;display:block;object-fit:cover}
.row input[type=text]{
flex:1;min-width:0;font-family:inherit;font-size:19px;padding:12px 14px;
border:2px solid var(--rule);border-radius:3px;background:var(--raised);color:var(--ink);
}
.row .stage-tag{font-size:15px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.mini{
font-size:16px;font-weight:600;padding:12px 16px;min-height:48px;
border:2px solid var(--rule);border-radius:3px;background:var(--raised);white-space:nowrap;
}
.ruler{
width:94.5px;height:94.5px;
flex:none;
border:2px solid var(--pom);
background:var(--pom-wash);
display:flex;align-items:center;justify-content:center;
font-size:14px;color:var(--pom);text-align:center;line-height:1.3;
border-radius:3px;
}
.cal{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.cal-ctl{display:flex;align-items:center;gap:14px}
.cal-val{
font-size:19px;font-weight:700;min-width:64px;text-align:center;
font-variant-numeric:tabular-nums;
}
.hidden{display:none !important}</style>
</head>
<body>
<div class="wrap">
  <!-- ============ HOME ============ -->
  <section class="screen active" id="s-home">
    <header class="masthead">
      <h1 class="wordmark">עוגן</h1>
      <span class="today" id="today-date"></span>
    </header>
    <!--
      Orientation, never a quiz. Waking takes him a few minutes to place himself,
      so the first thing on screen answers the question instead of asking it.
    -->
    <div class="orient">
      <p class="orient-day" id="orient-day"></p>
      <p class="orient-date" id="orient-date"></p>
      <p class="orient-note" id="orient-note"></p>
    </div>
    <p class="greeting" id="greeting">בוקר טוב.</p>
    <p class="greeting-sub" id="greeting-sub">שלושה דברים מחכים לך היום. אפשר גם רק אחד.</p>
    <div class="cards">
      <button class="card" id="card-faces">
        <span class="card-num">א</span>
        <span class="card-body">
          <span class="card-title">פנים</span>
          <span class="card-note" id="note-faces">שירה, הנינה שלך</span>
        </span>
        <span class="card-mark hidden">✓</span>
      </button>
      <button class="card" id="card-question">
        <span class="card-num">ב</span>
        <span class="card-body">
          <span class="card-title">שאלה</span>
          <span class="card-note" id="note-question">דנה שאלה אותך משהו</span>
        </span>
        <span class="card-mark hidden">✓</span>
      </button>
      <button class="card" id="card-puzzle">
        <span class="card-num">ג</span>
        <span class="card-body">
          <span class="card-title">חידה</span>
          <span class="card-note" id="note-puzzle">מה קרה קודם?</span>
        </span>
        <span class="card-mark hidden">✓</span>
      </button>
    </div>
    <p class="family-link">
      <button id="open-family">הגדרות משפחה</button>
    </p>
  </section>
  <!-- ============ FACES ============ -->
  <section class="screen" id="s-faces">
    <button class="back" data-go="s-home">→ חזרה</button>
    <p class="stage-line" id="faces-stage">להכיר</p>
    <div class="portrait-frame">
      <div class="portrait" id="faces-portrait"></div>
      <p class="person-name" id="faces-name">שירה</p>
      <p class="person-rel" id="faces-rel">הנינה שלך</p>
      <p class="person-fact" id="faces-fact"></p>
    </div>
    <p class="hint-name hidden" id="faces-hint"></p>
    <p class="feedback" id="faces-feedback" aria-live="polite"></p>
    <div class="stack" id="faces-actions"></div>
  </section>
  <!-- ============ QUESTION ============ -->
  <section class="screen" id="s-question">
    <button class="back" data-go="s-home">→ חזרה</button>
    <span class="from-line" id="q-from">מדנה</span>
    <p class="prompt" id="q-text"></p>
    <div class="stack">
      <button class="rec-btn" id="rec-btn">
        <span class="rec-dot"></span>
        <span id="rec-label">ספר לי</span>
        <span class="rec-time" id="rec-time"></span>
      </button>
